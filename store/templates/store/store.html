{% extends 'store/main.html' %}
{% load static %}
{% block content %}

<!-- search bar -->
<form method="GET" action=""></form>
    <input type="text" id="search-bar" placeholder="Search products or categories" onkeyup="filterProducts()">
    <button type="submit">Search</button>
</form>

<div id="search-popup" style="display:none;">
    <!-- Results from AJAX will be injected here -->
</div>

{% if not products %}
    <p>No products found for "{{ query }}".</p>
{% endif %}

<div id="products">
<div class="row store-pd-container">

    <!-- Rendering prodcuts from the database -->

    {% for product in products %}
    <div class="col-lg-4 product-card" class="product-card" data-name="{{ product.name }}" data-category="{{ product.category }}">
        <a href="#product-description-{{ product.id }}" class="product-detail-trigger"
            data-description-target="product-description-{{ product.id }}" aria-expanded="false">
            <div class="img-container">
                <img class="thumbnail" src="{{product.imageURL}}" alt="{{ product.name }}">
            </div>
            <h6 class="product-title"><strong>{{product.name}}</strong></h6>
        </a>

        <div class="product">
            <p id="product-description-{{ product.id }}" class="product-description" hidden>
                {{product.description}}
            </p>
            <hr>
            <button data-product={{product.id}} data-action="add" 
                class="btn btn-outline-secondary add-btn update-cart"
                style="height: 27px; width: 100px;"><small style="display: flex;" >Add to cart</small></button>
            <button type="button" class="btn btn-outline-success product-detail-trigger"
                data-description-target="product-description-{{ product.id }}" aria-expanded="false"
                style="height: 27px; width: 60px;"><small style="display: flex;">View</small></button>
            <h4 style="display: inline-block; float:none;">${{product.price|floatformat:2}}</h4>
        </div>
    </div>
    {% endfor %}

    
</div>
</div>

<script>
    function filterProducts() {
        const query = document.getElementById('search-bar').value.toLowerCase();
        const products = document.querySelectorAll('.product-card');

        products.forEach(product => {
            const productName = product.getAttribute('data-name').toLowerCase();
            const productCategory = product.getAttribute('data-category').toLowerCase();

            if (productName.includes(query) || productCategory.includes(query)) {
                product.style.display = 'block';
            } else {
                product.style.display = 'none';
            }
        });
    }
</script>

<script>
    document.querySelectorAll('.product-detail-trigger').forEach(trigger => {
        trigger.addEventListener('click', event => {
            event.preventDefault();
            const description = document.getElementById(trigger.dataset.descriptionTarget);
            const shouldShow = description.hidden;
            description.hidden = !shouldShow;
            document.querySelectorAll(
                `[data-description-target="${trigger.dataset.descriptionTarget}"]`
            ).forEach(control => control.setAttribute('aria-expanded', shouldShow));
        });
    });
</script>

<script src="{% static 'js/search.js' %}"></script>


{% endblock content %}
